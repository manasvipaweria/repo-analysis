name: Reusable Repo Analysis

on:
  workflow_call:
    inputs:
      tools:
        description: 'Comma-separated list of tools to run'
        required: false
        type: string
        default: 'ruff,bandit,semgrep,pip-audit,mypy,pytest,import-linter'

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target-repo
          
      - name: Checkout orchestrator repository
        uses: actions/checkout@v4
        with:
          repository: manasvipaweria/repo-analysis
          path: orchestrator-repo
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install orchestrator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r orchestrator-repo/requirements.txt
          
      - name: Run Repo Analysis Orchestrator
        id: analyze
        run: |
          cd target-repo
          python ../orchestrator-repo/analyze_repo.py . --repo-name ${{ github.repository }} --output json,csv
        
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-analysis-report
          path: |
            target-repo/report.json
            target-repo/report.csv
          if-no-files-found: warn
