name: Reusable Repo Analysis

on:
  workflow_call:
    inputs:
      tools:
        description: 'Comma-separated list of tools to run'
        required: false
        type: string
        default: 'ruff,bandit,semgrep,pip-audit,mypy,pytest,import-linter,snyk,dep-scan,dependency-cruiser,sonarqube,react-doctor,apnimandi-design'
      enable_codex:
        description: 'Enable OpenAI Codex Security and Codex Architecture scanners'
        required: false
        type: boolean
        default: false
      enable_design_ai:
        description: 'Enable AI Semantic Design Checks for frontend repos'
        required: false
        type: boolean
        default: false
    secrets:
      GEMINI_API_KEY:
        description: 'Gemini API Key'
        required: false
      OPENAI_API_KEY:
        description: 'OpenAI API Key for Codex scanners'
        required: false
      SNYK_TOKEN:
        description: 'Snyk API Token'
        required: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target-repo
          
      - name: Checkout orchestrator repository
        uses: actions/checkout@v4
        with:
          repository: manasvipaweria/repo-analysis
          path: orchestrator-repo
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install orchestrator and CLI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r orchestrator-repo/requirements.txt
          pip install owasp-depscan
          npm install -g snyk @cyclonedx/cdxgen dependency-cruiser react-doctor

      - name: Cache dep-scan VDB
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vdb
          key: depscan-vdb-app-${{ runner.os }}-${{ hashFiles('orchestrator-repo/requirements.txt') }}
          restore-keys: |
            depscan-vdb-app-${{ runner.os }}-

      - name: Provision dep-scan VDB
        env:
          VDB_HOME: ${{ github.workspace }}/.vdb
        run: |
          depscan-vdb download --scope app

      - name: Verify CLI Tools
        env:
          VDB_HOME: ${{ github.workspace }}/.vdb
        run: |
          depscan --version || exit 1
          depscan-vdb path || exit 1
          cdxgen --version || exit 1
          
      - name: Run Repo Analysis Orchestrator
        id: analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.5-flash
          AI_BATCH_SIZE: "5"
          AI_MAX_OUTPUT_TOKENS: "4000"
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          VDB_HOME: ${{ github.workspace }}/.vdb
          DEPSCAN_AUTO_DOWNLOAD: 'false'
          ENABLE_DESIGN_AI: ${{ inputs.enable_design_ai }}
        run: |
          cd target-repo
          rm -f report.json report.csv
          
          # Construct tools list
          TOOLS="${{ inputs.tools }}"
          if [ "${{ inputs.enable_codex }}" == "true" ]; then
            TOOLS="$TOOLS,codex-security,codex-architecture"
          fi
          
          python ../orchestrator-repo/analyze_repo.py . --repo-name ${{ github.repository }} --tools $TOOLS --output json,csv --run-ai
        
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-analysis-report
          path: |
            target-repo/report.json
            target-repo/report.csv
          if-no-files-found: error
