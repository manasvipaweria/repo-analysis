name: Reusable Repo Analysis

on:
  workflow_call:
    inputs:
      tools:
        description: 'Comma-separated list of tools to run'
        required: false
        type: string
        default: 'deslint'
      enable_codex:
        description: 'Enable OpenAI Codex Security and Codex Architecture scanners'
        required: false
        type: boolean
        default: false
      enable_design_ai:
        description: 'Enable AI Semantic Design Checks for frontend repos'
        required: false
        type: boolean
        default: true
      enable_deslint:
        description: 'Enable Deslint React UI Consistency analysis'
        required: false
        type: boolean
        default: true
    secrets:
      GEMINI_API_KEY:
        description: 'Gemini API Key'
        required: false
      OPENAI_API_KEY:
        description: 'OpenAI API Key for Codex scanners'
        required: false
      SNYK_TOKEN:
        description: 'Snyk API Token'
        required: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target-repo
          
      - name: Checkout orchestrator repository
        uses: actions/checkout@v4
        with:
          repository: manasvipaweria/repo-analysis
          path: orchestrator-repo
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install orchestrator and CLI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r orchestrator-repo/requirements.txt
          pip install owasp-depscan
          npm install -g snyk @cyclonedx/cdxgen dependency-cruiser react-doctor eslint @deslint/eslint-plugin

      - name: Cache dep-scan VDB
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vdb
          key: depscan-vdb-app-${{ runner.os }}-${{ hashFiles('orchestrator-repo/requirements.txt') }}
          restore-keys: |
            depscan-vdb-app-${{ runner.os }}-

      - name: Provision dep-scan VDB
        env:
          VDB_HOME: ${{ github.workspace }}/.vdb
        run: |
          depscan-vdb download --scope app

      - name: Verify CLI Tools
        env:
          VDB_HOME: ${{ github.workspace }}/.vdb
        run: |
          depscan --version || exit 1
          depscan-vdb path || exit 1
          cdxgen --version || exit 1

      - name: Ensure Codex state directory
        run: |
          mkdir -p "$HOME/.codex/state/plugins/codex-security/scans"
          chmod -R 700 "$HOME/.codex"

      - name: Install target repository frontend dependencies
        run: |
          if [ -d "target-repo/frontend" ] && [ -f "target-repo/frontend/package.json" ]; then
            echo "Installing frontend dependencies in target-repo/frontend..."
            cd target-repo/frontend
            NODE_ENV=development npm install --include=dev --no-fund --no-audit
            NODE_ENV=development npm install @deslint/eslint-plugin eslint --save-dev --no-fund --no-audit
          elif [ -f "target-repo/package.json" ]; then
            echo "Installing dependencies in target-repo root..."
            cd target-repo
            NODE_ENV=development npm install --include=dev --no-fund --no-audit
            NODE_ENV=development npm install @deslint/eslint-plugin eslint --save-dev --no-fund --no-audit
          fi

      - name: Verify Deslint dependency resolution
        run: |
          if [ -d "target-repo/frontend" ] && [ -f "target-repo/frontend/package.json" ]; then
            echo "Verifying Deslint package installation in target-repo/frontend..."
            cd target-repo/frontend
            if [ -d "node_modules/@deslint/eslint-plugin" ]; then
              echo "Found @deslint/eslint-plugin in target-repo/frontend/node_modules."
            else
              echo "WARNING: @deslint/eslint-plugin not found in target-repo/frontend/node_modules."
            fi
            npm list @deslint/eslint-plugin --depth=0 || true
            node -e "import('file://' + process.cwd() + '/node_modules/@deslint/eslint-plugin/dist/index.js').then(() => console.log('ESM resolution of @deslint/eslint-plugin succeeded.')).catch(e => console.error('ESM resolution error:', e.message))" || true
          fi

      - name: Run Repo Analysis Orchestrator
        id: analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.5-flash
          AI_BATCH_SIZE: "5"
          AI_MAX_OUTPUT_TOKENS: "4000"
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          VDB_HOME: ${{ github.workspace }}/.vdb
          DEPSCAN_AUTO_DOWNLOAD: 'false'
          ENABLE_DESIGN_AI: ${{ inputs.enable_design_ai }}
          ENABLE_DESLINT: ${{ inputs.enable_deslint }}
        run: |
          cd target-repo
          rm -f report.json report.csv
          
          # Construct tools list
          TOOLS="${{ inputs.tools }}"
          if [ "${{ inputs.enable_codex }}" == "true" ]; then
            TOOLS="$TOOLS,codex-security,codex-architecture"
          fi
          if [ "${{ inputs.enable_deslint }}" == "true" ] && [[ "$TOOLS" != *"deslint"* ]]; then
            TOOLS="$TOOLS,deslint"
          fi
          
          python ../orchestrator-repo/analyze_repo.py . --repo-name ${{ github.repository }} --tools $TOOLS --output json,csv --run-ai
        
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-analysis-report
          path: |
            target-repo/report.json
            target-repo/report.csv
          if-no-files-found: error
